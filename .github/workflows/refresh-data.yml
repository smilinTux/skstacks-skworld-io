name: refresh-data

# Regenerate the service catalog, release and counts from the public
# smilinTux/skstacks repo (scripts/gen-data.py), rewrite the generated blocks in
# index.html and llms.txt, and commit if anything changed. The output depends
# only on the upstream commit, so an unchanged upstream commits nothing.
#
# Triggers:
#   - schedule: once a day (06:37 UTC)
#   - workflow_dispatch: manual run from the Actions tab
#   - push to main: when the generator or this workflow changes

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/gen-data.py"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Regenerate data from upstream skstacks
        run: python3 scripts/gen-data.py

      - name: Update sitemap lastmod to the upstream commit date
        run: |
          d="$(python3 -c 'import json; print(json.load(open("data/summary.json"))["generated"])')"
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>${d}</lastmod>|" sitemap.xml

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/ index.html llms.txt sitemap.xml)" ]; then
            echo "No changes: data already matches upstream."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html llms.txt sitemap.xml
          git commit -m "data: refresh service catalog and release from upstream skstacks"
          git push
